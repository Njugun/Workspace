<a href="{% url 'home' %}" class="block rounded px-2 py-1.5 hover:bg-slate-200">Home</a>

{% for ws in sidebar_workspaces %}
<p class="mt-4 px-2 text-xs font-medium uppercase tracking-wide text-slate-400">{{ ws.name }}</p>
{% for page in ws.sidebar_pages %}
<a href="{% url 'page_detail' page.pk %}" style="padding-left: {{ page.indent }}rem"
   class="block rounded py-1.5 pr-2 hover:bg-slate-200">{{ page.title }}</a>
{% empty %}
<p class="px-2 py-1.5 text-slate-400">No pages yet</p>
{% endfor %}
{% if ws.my_role != 'viewer' %}
<a href="{% url 'page_create' ws.pk %}" class="block rounded px-2 py-1.5 text-slate-500 hover:bg-slate-200">+ New page</a>
{% endif %}
<a href="{% url 'members' ws.pk %}" class="block rounded px-2 py-1.5 text-slate-500 hover:bg-slate-200">Members</a>
{% empty %}
<p class="mt-4 px-2 text-slate-400">You are not in a workspace yet.</p>
{% endfor %}

<a href="{% url 'workspace_create' %}" class="mt-4 block rounded px-2 py-1.5 text-slate-500 hover:bg-slate-200">+ New workspace</a>
