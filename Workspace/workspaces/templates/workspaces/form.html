{% extends "app/layout.html" %}

{% block content %}
<div class="mx-auto mt-16 w-full max-w-sm px-6">
    <h1 class="text-2xl font-bold tracking-tight">{{ heading }}</h1>

    <form method="post" class="mt-6 space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<p class="mt-1 text-sm text-red-600">{{ error }}</p>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700">{{ button }}</button>
    </form>
</div>
{% endblock %}
